apply plugin: 'com.android.application'

android {
    namespace 'com.onrender.gre333_flashcards.twa' // same id as the first release, so it installs as an update
    compileSdk 36

    defaultConfig {
        applicationId 'com.onrender.gre333_flashcards.twa'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE') ?: '/keys/upload.keystore')
            storePassword System.getenv('KEY_PASSWORD')
            keyAlias 'upload'
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The built web app (npm run build) is copied to src/main/assets/www by build.sh.
    androidResources {
        noCompress 'mp3', 'woff2', 'woff', 'png'
    }
}
